# Complete Unicode Box Drawing block (U+2500–U+257F).
# Direction order is up, down, left, right: :box-ur: = └; :box-udlr: = ┼.
# Light is the default; where available use :box-heavy-…: or :box-double-…:.
matches:
  # BOX DRAWINGS LIGHT HORIZONTAL
  - trigger: ":box-lr:"
    replace: "─"

  # BOX DRAWINGS HEAVY HORIZONTAL
  - trigger: ":box-heavy-lr:"
    replace: "━"

  # BOX DRAWINGS LIGHT VERTICAL
  - trigger: ":box-ud:"
    replace: "│"

  # BOX DRAWINGS HEAVY VERTICAL
  - trigger: ":box-heavy-ud:"
    replace: "┃"

  # BOX DRAWINGS LIGHT TRIPLE DASH HORIZONTAL
  - trigger: ":box-dash3-lr:"
    replace: "┄"

  # BOX DRAWINGS HEAVY TRIPLE DASH HORIZONTAL
